name: Publicar sitio

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # reconstrucción diaria: las reuniones pasan de "próximas" a "anteriores" sin tocar nada
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - name: Generar sitio
        run: python build.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Comprobar enlaces internos
        run: python scripts/check_links.py dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
